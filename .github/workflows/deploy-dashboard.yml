name: deploy-dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published JSON
        run: |
          python3 -m json.tool data/products.json > /dev/null
          python3 -m json.tool data/stats.json > /dev/null
          python3 -m json.tool data/metadata.json > /dev/null
      - name: Required files present
        run: |
          for f in index.html product.html assets/app.js assets/style.css; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
      - name: Secret scan
        # The patterns are generated from publish_dashboard.py's own LEAK_PATTERNS and embedded
        # below (base64 of a JSON array), so CI and the pre-publish gate can never drift apart.
        # Python's `re` is used rather than `grep -E` on purpose: ERE has no lookbehind, and the
        # ASCII word boundaries this scan depends on cannot be expressed without it (a regex
        # word-boundary escape does not break against kana/kanji). A grep pattern for a Windows drive letter also matched the
        # `s:/` inside every `https://`, which made the previous version fail on a clean artifact.
        run: |
          python3 - <<'SCAN'
          import base64, json, pathlib, re, sys
          PATTERNS_B64 = ""
          patterns = json.loads(base64.b64decode(PATTERNS_B64).decode("utf-8"))
          compiled = [(name, re.compile(pat)) for name, pat in patterns]
          suffixes = (".html", ".js", ".css", ".json", ".svg", ".txt", ".yml", ".yaml")
          findings = []
          for path in sorted(pathlib.Path(".").rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in suffixes:
                  continue
              for n, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  for name, rx in compiled:
                      m = rx.search(line)
                      if m:
                          findings.append("%s:%d: %s: %r" % (path, n, name, m.group(0)[:80]))
          for f in findings[:80]:
              print(f)
          print("secret scan: %d finding(s)" % len(findings))
          sys.exit(1 if findings else 0)
          SCAN

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the published site
        # `path: .` would publish .github/workflows/deploy-dashboard.yml under .nojekyll,
        # handing a reader the exact internal-vocabulary blocklist. Stage the site instead.
        run: |
          mkdir -p _site
          cp index.html product.html .nojekyll _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
